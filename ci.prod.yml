schemaVersion: v0.2

prepare:
  steps:
    - name: Download Listmonk and prepare scripts
      command: bash src/prepare.sh

run:
  db:
    provider:
      name: postgres
      version: v1
    plan:
      id: 0

  app:
    plan: 0
    replicas: 1
    healthEndpoint: http://localhost:3000/health
    steps:
      - name: Generate config
        command: bash src/generate-config.sh
      - name: Run database setup
        command: ./listmonk --install --yes --config config.toml || true
      - name: Start Listmonk with SMTP setup
        command: bash src/start.sh

    env:
      DB_HOST: ms-postgres-v1-${{ team.id }}-db
      DB_PASSWORD: ${{ vault.DB_PASSWORD }}
      LISTMONK_ADMIN_USER: ${{ workspace.env['ADMIN_USER'] }}
      LISTMONK_ADMIN_PASSWORD: ${{ vault.ADMIN_PASSWORD }}
      SMTP_HOST: ${{ workspace.env['SMTP_HOST'] }}
      SMTP_PORT: ${{ workspace.env['SMTP_PORT'] }}
      SMTP_USER: ${{ workspace.env['SMTP_USER'] }}
      SMTP_PASSWORD: ${{ vault.SMTP_PASSWORD }}
      FROM_EMAIL: ${{ workspace.env['FROM_EMAIL'] }}
      SITE_NAME: ${{ workspace.env['SITE_NAME'] }}

    network:
      ports:
        - port: 3000
          isPublic: false
      paths:
        - port: 3000
          path: /
